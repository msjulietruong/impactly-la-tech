name: Frontend Server CI

on:
  push:
    branches:
      - main
    paths:
      - frontend-next/**

env:
  # TODO(liam)


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Azure Deploy Static App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ }}
        repo_token: ${{ }}
        action: "upload"
        app_location: "./frontend-next"
        api_location: "" # api src code path - optional
        output_location: "" # built app content dir - optional
