version: "3.9"

services:
  app:
    build: .
    container_name: poetry_agent
    command: poetry run uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - POETRY_VIRTUALENVS_CREATE=false
    ports:
      - "8000:8000"   # optional, if your app exposes something
    restart: unless-stopped
