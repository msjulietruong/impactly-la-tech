info:
  name: health
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3001/health
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status must be healthy", function() {
          const body = res.getBody();
          expect(body).to.have.property("status");
          expect(body.status).to.equal("healthy");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
