info:
  name: random product
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3001/api/products
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Products are valid", () => {
          expect(body).to.have.property("products");
          expect(body.products).to.be.an("array");
          expect(body.products.length).to.be.greaterThan(0);
        });

        const product = body.products[0];

        test("Product has a name", () => {
          expect(product).to.have.property("product_name");
          expect(product).to.have.property("code");
        })

        test("Product has valid embeddings", () => {
          expect(product.embedding).to.be.an("array");
          expect(product.embedding.length).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
